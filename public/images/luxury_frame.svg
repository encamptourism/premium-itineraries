<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 320" width="200" height="320">
  <defs>
    <!-- Metallic Gold Gradient matching reference image -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCE082"/>
      <stop offset="20%" stop-color="#E5B842"/>
      <stop offset="45%" stop-color="#C68E22"/>
      <stop offset="70%" stop-color="#F3CA5C"/>
      <stop offset="85%" stop-color="#DFAC38"/>
      <stop offset="100%" stop-color="#9C6B16"/>
