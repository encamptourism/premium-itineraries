    d="M 32,13 L 168,13 A 7,7 0 0 1 176,16 A 10,10 0 0 0 184,24 A 7,7 0 0 1 187,32 L 187,288 A 7,7 0 0 1 184,296 A 10,10 0 0 0 176,304 A 7,7 0 0 1 168,307 L 32,307 A 7,7 0 0 1 24,304 A 10,10 0 0 0 16,296 A 7,7 0 0 1 13,288 L 13,32 A 7,7 0 0 1 16,24 A 10,10 0 0 0 24,16 A 7,7 0 0 1 32,13 Z"
