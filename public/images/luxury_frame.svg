  />

  <!-- Outer Thick Metallic Gold Border -->
  <path
    d="M 30,5 L 170,5 A 10,10 0 0 1 180,9 A 14,14 0 0 0 191,20 A 10,10 0 0 1 195,30 L 195,290 A 10,10 0 0 1 191,300 A 14,14 0 0 0 180,311 A 10,10 0 0 1 170,315 L 30,315 A 10,10 0 0 1 20,311 A 14,14 0 0 0 9,300 A 10,10 0 0 1 5,290 L 5,30 A 10,10 0 0 1 9,20 A 14,14 0 0 0 20,9 A 10,10 0 0 1 30,5 Z"
