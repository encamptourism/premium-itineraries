<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 120" width="320" height="120">
  <defs>
    <linearGradient id="boatGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8E6A28" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#543C12" stop-opacity="0.65"/>
    </linearGradient>
    <linearGradient id="waterRipples" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#B88A2E" stop-opacity="0.0"/>
      <stop offset="30%" stop-color="#B88A2E" stop-opacity="0.3"/>
      <stop offset="70%" stop-color="#B88A2E" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#B88A2E" stop-opacity="0.0"/>
    </linearGradient>
  </defs>

  <!-- Water Reflections & Ripples -->
  <g stroke="url(#waterRipples)" stroke-width="1.2" stroke-linecap="round" fill="none">
    <path d="M 10,95 Q 60,92 110,95 Q 160,98 210,95 Q 260,92 310,95"/>
    <path d="M 40,102 Q 80,100 130,102 Q 180,104 230,102 Q 270,100 300,102"/>
    <path d="M 80,108 Q 140,106 190,108 Q 230,110 270,108"/>
  </g>

  <!-- Wooden Boat Hull Silhouette -->
  <g fill="url(#boatGrad)">
    <!-- Elegant Curved Indian Country Boat Hull -->
    <path d="M 60,82 
             C 90,82 120,83 170,83 
             C 215,83 250,81 275,70 
             C 285,65 292,58 298,50 
             C 293,66 280,82 250,88 
             C 200,94 130,94 85,91 
             C 65,89 50,86 42,80 
             C 48,81 54,82 60,82 Z"/>

    <!-- Seated Boatman Silhouette -->
    <!-- Head / Turban -->
    <circle cx="270" cy="42" r="5"/>
    <!-- Body / Torso leaning slightly forward -->
    <path d="M 264,48 
             C 260,53 260,62 263,72 
             L 278,72 
             C 278,63 277,54 274,48 Z"/>
    
    <!-- Long Rowing Oar -->
    <path d="M 252,54 L 210,102 L 205,101 L 249,52 Z"/>
    <ellipse cx="206" cy="103" rx="7" ry="2.5" transform="rotate(-35 206 103)"/>

    <!-- Gentle ripples near oar dip -->
    <ellipse cx="206" cy="104" rx="14" ry="2" fill="none" stroke="#B88A2E" stroke-width="0.8" opacity="0.4"/>
  </g>
</svg>
