<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 400" preserveAspectRatio="none">
  <defs>
    <linearGradient id="burGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFEAA8"/>
      <stop offset="20%" stop-color="#E5B942"/>
      <stop offset="45%" stop-color="#FDF1BF"/>
      <stop offset="70%" stop-color="#C59328"/>
      <stop offset="90%" stop-color="#E7BA4B"/>
      <stop offset="100%" stop-color="#A57319"/>
    </linearGradient>

    <linearGradient id="burGoldInner" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F9E2A0" stop-opacity="0.9"/>
      <stop offset="35%" stop-color="#E0B13D" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#C4922A" stop-opacity="0.85"/>
    </linearGradient>

    <radialGradient id="burBurgundyBg" cx="50%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#8B1E2D"/>
      <stop offset="35%" stop-color="#8B1E2D"/>
      <stop offset="75%" stop-color="#8B1E2D"/>
      <stop offset="100%" stop-color="#8B1E2D"/>
    </radialGradient>
  </defs>

  <!-- Deep Royal Burgundy Velvet Base Fill with Royal Top Arch Crest & Increased Border Radius (R=30) -->
  <path
    d="M 36,14 L 105,14 Q 122,14 130,8 Q 135,4 140,2 Q 145,4 150,8 Q 158,14 175,14 L 244,14 Q 274,14 274,44 L 274,360 Q 274,390 244,390 L 36,390 Q 6,390 6,360 L 6,44 Q 6,14 36,14 Z"
    fill="url(#burBurgundyBg)"
  />

  <!-- Outer Metallic Gold Border with Increased Border Radius (R=30) -->
  <path
    d="M 36,14 L 105,14 Q 122,14 130,8 Q 135,4 140,2 Q 145,4 150,8 Q 158,14 175,14 L 244,14 Q 274,14 274,44 L 274,360 Q 274,390 244,390 L 36,390 Q 6,390 6,360 L 6,44 Q 6,14 36,14 Z"
    fill="none"
    stroke="url(#burGoldGrad)"
    stroke-width="1.8"
  />

  <!-- Top Center Golden Finial Crest -->
  <polygon points="140,0 144,4 140,8 136,4" fill="url(#burGoldGrad)"/>

  <!-- Inner Inset Parallel Gold Border with Concentric Matching Radius -->
  <path
    d="M 36,20 L 107,20 Q 123,20 131,14 Q 136,10 140,8 Q 144,10 149,14 Q 157,20 173,20 L 244,20 Q 268,20 268,44 L 268,360 Q 268,384 244,384 L 36,384 Q 12,384 12,360 L 12,44 Q 12,20 36,20 Z"
    fill="none"
    stroke="url(#burGoldInner)"
    stroke-width="0.85"
  />

  <!-- Corner Flourish Accents in Gold -->
  <g fill="none" stroke="url(#burGoldGrad)" stroke-width="0.9" stroke-linecap="round">
    <path d="M 22,36 Q 28,36 28,30"/>
    <path d="M 258,36 Q 252,36 252,30"/>
    <path d="M 22,368 Q 28,368 28,374"/>
    <path d="M 258,368 Q 252,368 252,374"/>
  </g>

  <!-- Corner Accent Dots -->
  <g fill="url(#burGoldGrad)">
    <circle cx="28" cy="36" r="1.3"/>
    <circle cx="252" cy="36" r="1.3"/>
    <circle cx="28" cy="368" r="1.3"/>
    <circle cx="252" cy="368" r="1.3"/>
  </g>
</svg>
