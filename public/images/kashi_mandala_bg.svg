<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600">
  <defs>
    <linearGradient id="mandalaGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C59B3F" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#EED58E" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#A57522" stop-opacity="0.15"/>
    </linearGradient>
  </defs>

  <g transform="translate(300, 300)" stroke="url(#mandalaGold)" fill="none">
    <!-- Concentric Circles -->
    <circle r="30" stroke-width="1.2"/>
    <circle r="55" stroke-width="0.8" stroke-dasharray="3,3"/>
    <circle r="80" stroke-width="1"/>
    <circle r="120" stroke-width="0.9"/>
    <circle r="150" stroke-width="1.2" stroke-dasharray="4,4"/>
    <circle r="190" stroke-width="0.8"/>
    <circle r="230" stroke-width="1.1"/>
    <circle r="270" stroke-width="1.4"/>
    <circle r="285" stroke-width="0.8" stroke-dasharray="2,4"/>

    <!-- Central Rosette 8 Petals -->
    <g stroke-width="1.1">
      <path d="M 0,0 Q 15,-25 0,-50 Q -15,-25 0,0"/>
      <path d="M 0,0 Q 25,-15 50,0 Q 25,15 0,0"/>
      <path d="M 0,0 Q 15,25 0,50 Q -15,25 0,0"/>
      <path d="M 0,0 Q -25,15 -50,0 Q -25,-15 0,0"/>
      <path d="M 0,0 Q 28,-7 35,-35 Q 7,-28 0,0"/>
      <path d="M 0,0 Q 28,7 35,35 Q 7,28 0,0"/>
      <path d="M 0,0 Q -28,7 -35,35 Q -7,28 0,0"/>
      <path d="M 0,0 Q -28,-7 -35,-35 Q -7,-28 0,0"/>
    </g>

    <!-- 16 Lotus Petals Layer 1 -->
    <g stroke-width="1">
      <!-- Repeated in 16 increments of 22.5 deg -->
      <path d="M 0,-80 C 20,-100 25,-115 0,-120 C -25,-115 -20,-100 0,-80"/>
      <path d="M 0,-80 C 20,-100 25,-115 0,-120 C -25,-115 -20,-100 0,-80" transform="rotate(22.5)"/>
      <path d="M 0,-80 C 20,-100 25,-115 0,-120 C -25,-115 -20,-100 0,-80" transform="rotate(45)"/>
      <path d="M 0,-80 C 20,-100 25,-115 0,-120 C -25,-115 -20,-100 0,-80" transform="rotate(67.5)"/>
      <path d="M 0,-80 C 20,-100 25,-115 0,-120 C -25,-115 -20,-100 0,-80" transform="rotate(90)"/>
      <path d="M 0,-80 C 20,-100 25,-115 0,-120 C -25,-115 -20,-100 0,-80" transform="rotate(112.5)"/>
      <path d="M 0,-80 C 20,-100 25,-115 0,-120 C -25,-115 -20,-100 0,-80" transform="rotate(135)"/>
      <path d="M 0,-80 C 20,-100 25,-115 0,-120 C -25,-115 -20,-100 0,-80" transform="rotate(157.5)"/>
      <path d="M 0,-80 C 20,-100 25,-115 0,-120 C -25,-115 -20,-100 0,-80" transform="rotate(180)"/>
      <path d="M 0,-80 C 20,-100 25,-115 0,-120 C -25,-115 -20,-100 0,-80" transform="rotate(202.5)"/>
      <path d="M 0,-80 C 20,-100 25,-115 0,-120 C -25,-115 -20,-100 0,-80" transform="rotate(225)"/>
      <path d="M 0,-80 C 20,-100 25,-115 0,-120 C -25,-115 -20,-100 0,-80" transform="rotate(247.5)"/>
      <path d="M 0,-80 C 20,-100 25,-115 0,-120 C -25,-115 -20,-100 0,-80" transform="rotate(270)"/>
      <path d="M 0,-80 C 20,-100 25,-115 0,-120 C -25,-115 -20,-100 0,-80" transform="rotate(292.5)"/>
      <path d="M 0,-80 C 20,-100 25,-115 0,-120 C -25,-115 -20,-100 0,-80" transform="rotate(315)"/>
      <path d="M 0,-80 C 20,-100 25,-115 0,-120 C -25,-115 -20,-100 0,-80" transform="rotate(337.5)"/>
    </g>

    <!-- Outer Arch Crests Layer 2 -->
    <g stroke-width="0.9">
      <path d="M -29,-188 Q 0,-225 29,-188" transform="rotate(0)"/>
      <path d="M -29,-188 Q 0,-225 29,-188" transform="rotate(22.5)"/>
      <path d="M -29,-188 Q 0,-225 29,-188" transform="rotate(45)"/>
      <path d="M -29,-188 Q 0,-225 29,-188" transform="rotate(67.5)"/>
      <path d="M -29,-188 Q 0,-225 29,-188" transform="rotate(90)"/>
      <path d="M -29,-188 Q 0,-225 29,-188" transform="rotate(112.5)"/>
      <path d="M -29,-188 Q 0,-225 29,-188" transform="rotate(135)"/>
      <path d="M -29,-188 Q 0,-225 29,-188" transform="rotate(157.5)"/>
      <path d="M -29,-188 Q 0,-225 29,-188" transform="rotate(180)"/>
      <path d="M -29,-188 Q 0,-225 29,-188" transform="rotate(202.5)"/>
      <path d="M -29,-188 Q 0,-225 29,-188" transform="rotate(225)"/>
      <path d="M -29,-188 Q 0,-225 29,-188" transform="rotate(247.5)"/>
      <path d="M -29,-188 Q 0,-225 29,-188" transform="rotate(270)"/>
      <path d="M -29,-188 Q 0,-225 29,-188" transform="rotate(292.5)"/>
      <path d="M -29,-188 Q 0,-225 29,-188" transform="rotate(315)"/>
      <path d="M -29,-188 Q 0,-225 29,-188" transform="rotate(337.5)"/>
    </g>

    <!-- Outer Rim Scallops -->
    <g stroke-width="0.8">
      <circle cx="0" cy="-270" r="4" fill="url(#mandalaGold)"/>
      <circle cx="0" cy="-270" r="4" fill="url(#mandalaGold)" transform="rotate(22.5)"/>
      <circle cx="0" cy="-270" r="4" fill="url(#mandalaGold)" transform="rotate(45)"/>
      <circle cx="0" cy="-270" r="4" fill="url(#mandalaGold)" transform="rotate(67.5)"/>
      <circle cx="0" cy="-270" r="4" fill="url(#mandalaGold)" transform="rotate(90)"/>
      <circle cx="0" cy="-270" r="4" fill="url(#mandalaGold)" transform="rotate(112.5)"/>
      <circle cx="0" cy="-270" r="4" fill="url(#mandalaGold)" transform="rotate(135)"/>
      <circle cx="0" cy="-270" r="4" fill="url(#mandalaGold)" transform="rotate(157.5)"/>
      <circle cx="0" cy="-270" r="4" fill="url(#mandalaGold)" transform="rotate(180)"/>
      <circle cx="0" cy="-270" r="4" fill="url(#mandalaGold)" transform="rotate(202.5)"/>
      <circle cx="0" cy="-270" r="4" fill="url(#mandalaGold)" transform="rotate(225)"/>
      <circle cx="0" cy="-270" r="4" fill="url(#mandalaGold)" transform="rotate(247.5)"/>
      <circle cx="0" cy="-270" r="4" fill="url(#mandalaGold)" transform="rotate(270)"/>
      <circle cx="0" cy="-270" r="4" fill="url(#mandalaGold)" transform="rotate(292.5)"/>
      <circle cx="0" cy="-270" r="4" fill="url(#mandalaGold)" transform="rotate(315)"/>
      <circle cx="0" cy="-270" r="4" fill="url(#mandalaGold)" transform="rotate(337.5)"/>
    </g>
  </g>
</svg>
