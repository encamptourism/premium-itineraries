<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 450" width="700" height="450">
  <defs>
    <!-- Warm Sepia/Gold Atmospheric Gradient -->
    <linearGradient id="templeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#C59B3F" stop-opacity="0.32"/>
      <stop offset="60%" stop-color="#E2CCA0" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.0"/>
    </linearGradient>

    <!-- Faint Distant Temples -->
    <linearGradient id="distantTempleGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#B88A2E" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.0"/>
    </linearGradient>
  </defs>

  <!-- Distant Background Spire Silhouettes -->
  <g fill="url(#distantTempleGrad)">
    <!-- Tower 1 -->
    <path d="M 120,400 L 150,160 Q 155,110 160,80 Q 165,110 170,160 L 200,400 Z"/>
    <!-- Tower 2 -->
    <path d="M 280,400 L 310,180 Q 315,130 320,100 Q 325,130 330,180 L 360,400 Z"/>
    <!-- Small Domes -->
    <path d="M 220,400 L 220,320 Q 240,290 260,320 L 260,400 Z"/>
  </g>

  <!-- Foreground Main Ghat Temple Silhouette -->
  <g fill="url(#templeGrad)">
    <!-- Tall Central Shikhara Spire -->
    <path d="M 450,450 
             L 450,280 
             L 470,250 
             L 480,200 
             Q 510,130 520,30 
             Q 530,130 560,200 
             L 570,250 
             L 590,280 
             L 590,450 Z"/>

    <!-- Kalash & Trishul Finial on Spire -->
    <circle cx="520" cy="22" r="6"/>
    <path d="M 520,16 L 520,2"/>

    <!-- Secondary Spire Left -->
    <path d="M 370,450 
             L 370,300 
             L 385,260 
             Q 410,170 418,90 
             Q 426,170 450,260 
             L 465,300 
             L 465,450 Z"/>
    <circle cx="418" cy="84" r="5"/>

    <!-- Right Flanking Spire -->
    <path d="M 580,450 
             L 580,310 
             Q 615,220 625,110 
             Q 635,220 670,310 
             L 670,450 Z"/>
    <circle cx="625" cy="104" r="5"/>

    <!-- Stepped Ghat Platform Base -->
    <path d="M 320,450 L 320,380 L 700,380 L 700,450 Z"/>
    <path d="M 280,450 L 280,410 L 700,410 L 700,450 Z"/>
    <path d="M 240,450 L 240,430 L 700,430 L 700,450 Z"/>

    <!-- Temple Flags / Dhwaja fluttering -->
    <path d="M 520,28 L 542,35 L 520,42 Z"/>
    <path d="M 418,88 L 436,94 L 418,100 Z"/>
  </g>

  <!-- Soaring Birds in the Morning Sky -->
  <g fill="none" stroke="#A57522" stroke-width="1.3" stroke-linecap="round" opacity="0.35">
    <path d="M 80,90 Q 90,82 100,90 Q 110,82 120,90"/>
    <path d="M 140,70 Q 148,64 156,70 Q 164,64 172,70"/>
    <path d="M 110,120 Q 117,114 124,120 Q 131,114 138,120"/>
    <path d="M 220,60 Q 230,52 240,60 Q 250,52 260,60"/>
    <path d="M 270,85 Q 278,79 286,85 Q 294,79 302,85"/>
  </g>
</svg>
